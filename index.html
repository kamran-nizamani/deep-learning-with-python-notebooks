<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Deep Learning Notebooks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar, chapter sidebar (drawer on phones), one reading column of copyable code blocks. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #101a24;
  --muted: #566677;
  --line: #d4dbe2;
  --accent: #0b6b5b;
  --accent-ink: #ffffff;
  --accent-soft: #d9eee9;
  --code-bg: #f6f8fa;
  --bar-bg: #ffffff;
  --focus: #0b6b5b;
  --t-keyword: #8a3fb8;
  --t-string: #17784a;
  --t-number: #b05600;
  --t-comment: #74818e;
  --t-title: #0b5fb0;
  --t-builtin: #1b7686;
  --t-meta: #b05600;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bar-h: 56px;
  --code-size: 13px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1217;
    --panel: #141b22;
    --ink: #e6ecf1;
    --muted: #93a2b1;
    --line: #26323d;
    --accent: #4fd1b5;
    --accent-ink: #06201a;
    --accent-soft: #15332e;
    --code-bg: #0a0f14;
    --bar-bg: #111820;
    --focus: #4fd1b5;
    --t-keyword: #c792ea;
    --t-string: #8fd18b;
    --t-number: #f2a65a;
    --t-comment: #6d7f90;
    --t-title: #7db7f2;
    --t-builtin: #6cc4d4;
    --t-meta: #f2a65a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1217;
  --panel: #141b22;
  --ink: #e6ecf1;
  --muted: #93a2b1;
  --line: #26323d;
  --accent: #4fd1b5;
  --accent-ink: #06201a;
  --accent-soft: #15332e;
  --code-bg: #0a0f14;
  --bar-bg: #111820;
  --focus: #4fd1b5;
  --t-keyword: #c792ea;
  --t-string: #8fd18b;
  --t-number: #f2a65a;
  --t-comment: #6d7f90;
  --t-title: #7db7f2;
  --t-builtin: #6cc4d4;
  --t-meta: #f2a65a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bar-bg);
  z-index: 50;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Top bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--bar-bg);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: -0.01em;
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.brand span { color: var(--accent); }
.spacer { flex: 1; }
.tool {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  min-height: 36px;
  min-width: 36px;
  padding: 0 10px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
}
.tool:hover { border-color: var(--accent); }
.menu-btn { display: none; }

/* Shell */
.app {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 40px;
  max-width: 1280px;
  margin: 0 auto;
  padding-block: 24px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.side {
  position: sticky;
  top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 24px);
  align-self: start;
  max-height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top, 0px) - 48px);
  overflow-y: auto;
  min-width: 0;
  padding-right: 4px;
}
.search {
  width: 100%;
  min-height: 40px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 6px;
  padding: 0 12px;
  font: inherit;
  font-size: 0.92rem;
}
.search::placeholder { color: var(--muted); }
.side-label {
  margin: 20px 0 8px;
  font-family: var(--font-code);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.chlist, .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.chlink {
  display: grid;
  grid-template-columns: 2.2em minmax(0, 1fr);
  gap: 8px;
  align-items: baseline;
  padding: 8px 10px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 0.92rem;
  line-height: 1.35;
}
.chlink .n { font-family: var(--font-code); font-size: 0.78rem; color: var(--muted); }
.chlink:hover { background: var(--accent-soft); }
.chlink[aria-current="page"] { background: var(--accent-soft); font-weight: 600; }
.chlink[aria-current="page"] .n { color: var(--accent); }
.res {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.res:hover { background: var(--accent-soft); }
.res .where { font-size: 0.78rem; color: var(--muted); }
.res .snip {
  display: block;
  margin-top: 2px;
  font-family: var(--font-code);
  font-size: 0.78rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.res mark { background: var(--accent-soft); color: var(--ink); border-radius: 2px; box-shadow: 0 0 0 1px var(--accent); }
.empty { color: var(--muted); font-size: 0.9rem; padding: 8px 10px; }

/* Main column */
.main { min-width: 0; max-width: 900px; }
.eyebrow {
  font-family: var(--font-code);
  font-size: 0.74rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 8px;
}
h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4.2vw, 2.5rem); line-height: 1.12; }
.lede { color: var(--muted); max-width: 62ch; margin: 14px 0 0; }
.meta { font-family: var(--font-code); font-size: 0.8rem; color: var(--muted); margin: 14px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btn {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: 0.88rem;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.body { margin-top: 28px; display: grid; gap: 14px; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec h2 { font-size: 1.4rem; margin-top: 22px; }
.sec h3 { font-size: 1.1rem; margin-top: 12px; }
.sec h4 { font-size: 0.98rem; margin-top: 6px; color: var(--muted); }
.sec .btn { min-height: 32px; padding: 0 10px; font-size: 0.8rem; margin-top: 12px; }
.note { margin: 0; color: var(--muted); max-width: 66ch; }

.cell {
  margin: 0;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
  scroll-margin-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px);
}
.cell.hit { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 6px 4px 12px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-code);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.copy {
  min-height: 30px;
  min-width: 64px;
  padding: 0 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 5px;
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  cursor: pointer;
}
.copy:hover { border-color: var(--accent); }
.copy.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
pre {
  margin: 0;
  padding: 14px 16px;
  overflow-x: auto;
  tab-size: 4;
  font-family: var(--font-code);
  font-size: var(--code-size);
  line-height: 1.6;
}
code { font-family: inherit; }
.hljs-keyword, .hljs-literal { color: var(--t-keyword); }
.hljs-string, .hljs-subst { color: var(--t-string); }
.hljs-number { color: var(--t-number); }
.hljs-comment { color: var(--t-comment); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--t-title); }
.hljs-built_in, .hljs-type { color: var(--t-builtin); }
.hljs-meta, .hljs-params { color: var(--t-meta); }
.hljs-params { color: inherit; }

/* Overview */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 28px; }
.card {
  display: grid;
  gap: 6px;
  align-content: start;
  padding: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  text-decoration: none;
  min-width: 0;
}
.card:hover { border-color: var(--accent); }
.card .num { font-family: var(--font-code); font-size: 0.78rem; color: var(--accent); letter-spacing: 0.06em; }
.card .t { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
.card .m { font-family: var(--font-code); font-size: 0.75rem; color: var(--muted); }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 36px; }
.pager a { flex: 1 1 220px; }
.pager .next { text-align: right; justify-content: flex-end; }

.scrim { position: fixed; inset: 0; background: rgba(5, 10, 15, 0.55); z-index: 55; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .menu-btn { display: inline-block; }
  .side {
    position: fixed;
    z-index: 60;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(86vw, 340px);
    max-height: none;
    background: var(--bar-bg);
    border-right: 1px solid var(--line);
    padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: 16px;
    transform: translateX(-105%);
    transition: transform 0.2s ease;
  }
  .side.open { transform: translateX(0); }
  .pager .next { text-align: left; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  .side { transition: none; }
}
</style>
</head>

oftmax\"\n        self.dense = layers.Dense(num_units, activation=activation)\n\n    def call(self, inputs):\n        return self.dense(inputs)\n\ninputs = keras.Input(shape=(3,))\nfeatures = layers.Dense(64, activation=\"relu\")(inputs)\noutputs = Classifier(num_classes=10)(features)\nmodel = keras.Model(inputs=inputs, outputs=outputs)"],["c","inputs = keras.Input(shape=(64,))\noutputs = layers.Dense(1, activation=\"sigmoid\")(inputs)\nbinary_classifier = keras.Model(inputs=inputs, outputs=outputs)\n\nclass MyModel(keras.Model):\n    def __init__(self, num_classes=2):\n        super().__init__()\n        self.dense = layers.Dense(64, activation=\"relu\")\n        self.classifier = binary_classifier\n\n    def call(self, inputs):\n        features = self.dense(inputs)\n        return self.classifier(features)\n\nmodel = MyModel()"],["h","Remember: Use the right tool for the job",4],["h","Using built-in training and evaluation loops",3],["c","from keras.datasets import mnist\n\ndef get_mnist_model():\n    inputs = keras.Input(shape=(28 * 28,))\n    features = layers.Dense(512, activation=\"relu\")(inputs)\n    features = layers.Dropout(0.5)(features)\n    outputs = layers.Dense(10, activation=\"softmax\")(features)\n    model = keras.Model(inputs, outputs)\n    return model\n\n(images, labels), (test_images, test_labels) = mnist.load_data()\nimages = images.reshape((60000, 28 * 28)).astype(\"float32\") / 255\ntest_images = test_images.reshape((10000, 28 * 28)).astype(\"float32\") / 255\ntrain_images, val_images = images[10000:], images[:10000]\ntrain_labels, val_labels = labels[10000:], labels[:10000]\n\nmodel = get_mnist_model()\nmodel.compile(\n    optimizer=\"adam\",\n    loss=\"sparse_categorical_crossentropy\",\n    metrics=[\"accuracy\"],\n)\nmodel.fit(\n    train_images,\n    train_labels,\n    epochs=3,\n    validation_data=(val_images, val_labels),\n)\ntest_metrics = model.evaluate(test_images, test_labels)\npredictions = model.predict(test_images)"],["h","Writing your own metrics",4],["c","from keras import ops\n\nclass RootMeanSquaredError(keras.metrics.Metric):\n    def __init__(self, name=\"rmse\", **kwargs):\n        super().__init__(name=name, **kwargs)\n        self.mse_sum = self.add_weight(name=\"mse_sum\", initializer=\"zeros\")\n        self.total_samples = self.add_weight(\n            name=\"total_samples\", initializer=\"zeros\"\n        )\n\n    def update_state(self, y_true, y_pred, sample_weight=None):\n        y_true = ops.one_hot(y_true, num_classes=ops.shape(y_pred)[1])\n        mse = ops.sum(ops.square(y_true - y_pred))\n        self.mse_sum.assign_add(mse)\n        num_samples = ops.shape(y_pred)[0]\n        self.total_samples.assign_add(num_samples)\n\n    def result(self):\n        return ops.sqrt(self.mse_sum / self.total_samples)\n\n    def reset_state(self):\n        self.mse_sum.assign(0.)\n        self.total_samples.assign(0.)"],["c","model = get_mnist_model()\nmodel.compile(\n    optimizer=\"adam\",\n    loss=\"sparse_categorical_crossentropy\",\n    metrics=[\"accuracy\", RootMeanSquaredError()],\n)\nmodel.fit(\n    train_images,\n    train_labels,\n    epochs=3,\n    validation_data=(val_images, val_labels),\n)\ntest_metrics = model.evaluate(test_images, test_labels)"],["h","Using callbacks",4],["h","The EarlyStopping and ModelCheckpoint callbacks",5],["c","callbacks_list = [\n    keras.callbacks.EarlyStopping(\n        monitor=\"accuracy\",\n        patience=1,\n    ),\n    keras.callbacks.ModelCheckpoint(\n        filepath=\"checkpoint_path.keras\",\n        monitor=\"val_loss\",\n        save_best_only=True,\n    ),\n]\nmodel = get_mnist_model()\nmodel.compile(\n    optimizer=\"adam\",\n    loss=\"sparse_categorical_crossentropy\",\n    metrics=[\"accuracy\"],\n)\nmodel.fit(\n    train_images,\n    train_labels,\n    epochs=10,\n    callbacks=callbacks_list,\n    validation_data=(val_images, val_labels),\n)"],["c","model = keras.models.load_model(\"checkpoint_path.keras\")"],["h","Wri ions = model(inputs, training=True)\n        loss = loss_fn(targets, predictions)\n    gradients = tape.gradient(loss, model.trainable_weights)\n    optimizer.apply(gradients, model.trainable_weights)\n    return loss"],["c","%%backend tensorflow\nbatch_size = 32\ninputs = train_images[:batch_size]\ntargets = train_labels[:batch_size]\nloss = train_step(inputs, targets)"],["h","A PyTorch training step function",5],["c","%%backend torch\nimport torch\n\nmodel = get_mnist_model()\nloss_fn = keras.losses.SparseCategoricalCrossentropy()\noptimizer = keras.optimizers.Adam()\n\ndef train_step(inputs, targets):\n    predictions = model(inputs, training=True)\n    loss = loss_fn(targets, predictions)\n    loss.backward()\n    gradients = [weight.value.grad for weight in model.trainable_weights]\n    with torch.no_grad():\n        optimizer.apply(gradients, model.trainable_weights)\n    model.zero_grad()\n    return loss"],["c","%%backend torch\nbatch_size = 32\ninputs = train_images[:batch_size]\ntargets = train_labels[:batch_size]\nloss = train_step(inputs, targets)"],["h","A JAX training step function",5],["c","%%backend jax\nmodel = get_mnist_model()\nloss_fn = keras.losses.SparseCategoricalCrossentropy()\n\ndef compute_loss_and_updates(\n    trainable_variables, non_trainable_variables, inputs, targets\n):\n    outputs, non_trainable_variables = model.stateless_call(\n        trainable_variables, non_trainable_variables, inputs, training=True\n    )\n    loss = loss_fn(targets, outputs)\n    return loss, non_trainable_variables"],["c","%%backend jax\nimport jax\n\ngrad_fn = jax.value_and_grad(compute_loss_and_updates, has_aux=True)"],["c","%%backend jax\noptimizer = keras.optimizers.Adam()\noptimizer.build(model.trainable_variables)\n\ndef train_step(state, inputs, targets):\n    (trainable_variables, non_trainable_variables, optimizer_variables) = state\n    (loss, non_trainable_variables), grads = grad_fn(\n        trainable_variables, non_trainable_variables, inputs, targets\n    )\n    trainable_variables, optimizer_variables = optimizer.stateless_apply(\n        optimizer_variables, grads, trainable_variables\n    )\n    return loss, (\n        trainable_variables,\n        non_trainable_variables,\n        optimizer_variables,\n    )"],["c","%%backend jax\nbatch_size = 32\ninputs = train_images[:batch_size]\ntargets = train_labels[:batch_size]\n\ntrainable_variables = [v.value for v in model.trainable_variables]\nnon_trainable_variables = [v.value for v in model.non_trainable_variables]\noptimizer_variables = [v.value for v in optimizer.variables]\n\nstate = (trainable_variables, non_trainable_variables, optimizer_variables)\nloss, state = train_step(state, inputs, targets)"],["h","Low-level usage of metrics",4],["c","from keras import ops\n\nmetric = keras.metrics.SparseCategoricalAccuracy()\ntargets = ops.array([0, 1, 2])\npredictions = ops.array([[1, 0, 0], [0, 1, 0], [0, 0, 1]])\nmetric.update_state(targets, predictions)\ncurrent_result = metric.result()\nprint(f\"result: {current_result:.2f}\")"],["c","values = ops.array([0, 1, 2, 3, 4])\nmean_tracker = keras.metrics.Mean()\nfor value in values:\n    mean_tracker.update_state(value)\nprint(f\"Mean of values: {mean_tracker.result():.2f}\")"],["c","metric = keras.metrics.SparseCategoricalAccuracy()\ntargets = ops.array([0, 1, 2])\npredictions = ops.array([[1, 0, 0], [0, 1, 0], [0, 0, 1]])\n\nmetric_variables = metric.variables\nmetric_variables = metric.stateless_update_state(\n    metric_variables, targets, predictions\n)\ncurrent_result = metric.stateless_result(metric_variables)\nprint(f\"result: {current_result:.2f}\")\n\nmetric_variables = metric.stateless_reset_state()"],["h","Using fit() with a custom training loop",4],["h","Customizing fit() with TensorFlow",5],["c","%%backend tensorflow\nimport keras\nfrom keras import layers\n\nloss_fn = keras.losses.SparseCategoricalCrossentropy()\nloss_tracker = keras.metrics.Mean(name=\"loss\")\n\nclass CustomModel(keras.Model):\n    def train_step(self, data):\n        inputs, targets = data\n        with tf.GradientTape() as tape:\n            predictions = self(inputs, training=True)\n            loss = loss_fn(targets, predictions)\n        gradients = tape.gradient(loss, self.trainable_weights)\n        self.optimizer.apply(gradients, self.trainable_weights)\n\n        loss_tracker.update_state(loss)\n        return {\"loss\": loss_tracker.result()}\n\n    @property\n    def metrics(self):\n        return [loss_tracker]"],["c","%%backend tensorflow\ndef get_custom_model():\n    inputs = keras.Input(shape=(28 * 28,))\n    features = layers.Dense(512, activation=\"relu\")(inputs)\n    features = layers.Dropout(0.5)(features)\n    outputs = layers.Dense(10, activation=\"softmax\")(features)\n    model = CustomModel(inputs, outputs)\n    model.compile(optimizer=keras.optimizers.Adam())\n    return model"],["c","%%backend tensorflow\nmodel = get_custom_model()\nmodel.fit(train_images, train_labels, epochs=3)"],["h","Customizing fit() with PyTorch",5],["c","%%backend torch\nimport keras\nfrom keras import layers\n\nloss_fn = keras.losses.SparseCategoricalCrossentropy()\nloss_tracker = keras.metrics.Mean(name=\"loss\")\n\nclass CustomModel(keras.Model):\n    def train_step(self, data):\n        inputs, targets = data\n        predictions = self(inputs, training=True)\n        loss = loss_fn(targets, predictions)\n\n        loss.backward()\n        trainable_weights = [v for v in self.trainable_weights]\n        gradients = [v.value.grad for v in trainable_weights]\n\n        with torch.no_grad():\n            self.optimizer.apply(gradients, trainable_weights)\n\n        loss_tracker.update_state(loss)\n        return {\"loss\": loss_tracker.result()}\n\n    @property\n    def metrics(self):\n        return [loss_tracker]"],["c","%%backend torch\ndef get_custom_model():\n    inputs = keras.Input(shape=(28 * 28,))\n    features = layers.Dense(512, activation=\"relu\")(inputs)\n    features \ndef get_custom_model():\n    inputs = keras.Input(shape=(28 * 28,))\n    features = layers.Dense(512, activation=\"relu\")(inputs)\n    features = layers.Dropout(0.5)(features)\n    outputs = layers.Dense(10, activation=\"softmax\")(features)\n    model = CustomModel(inputs, outputs)\n    model.compile(optimizer=keras.optimizers.Adam())\n    return model"],["c","%%backend jax\nmodel = get_custom_model()\nmodel.fit(train_images, train_labels, epochs=3)"],["h","Handling metrics in a custom train_step()",4],["h","train_step() metrics handling with TensorFlow",5],["c","%%backend tensorflow\nimport keras\nfrom keras import layers\n\nclass CustomModel(keras.Model):\n    def train_step(self, data):\n        inputs, targets = data\n        with tf.GradientTape() as tape:\n            predictions = self(inputs, training=True)\n            loss = self.compute_loss(y=targets, y_pred=predictions)\n\n        gradients = tape.gradient(loss, self.trainable_weights)\n        self.optimizer.apply(gradients, self.trainable_weights)\n\n        for metric in self.metrics:\n            if metric.name == \"loss\":\n                metric.update_state(loss)\n            else:\n                metric.update_state(targets, predictions)\n\n        return {m.name: m.result() for m in self.metrics}"],["c","%%backend tensorflow\ndef get_custom_model():\n    inputs = keras.Input(shape=(28 * 28,))\n    features = layers.Dense(512, activation=\"relu\")(inputs)\n    features = layers.Dropout(0.5)(features)\n    outputs = layers.Dense(10, activation=\"softmax\")(features)\n    model = CustomModel(inputs, outputs)\n    model.compile(\n        optimizer=keras.optimizers.Adam(),\n        loss=keras.losses.SparseCategoricalCrossentropy(),\n        metrics=[keras.metrics.SparseCategoricalAccuracy()],\n    )\n    return model\n\nmodel = get_custom_model()\nmodel.fit(train_images, train_labels, epochs=3)"],["h","train_step() metrics handling with PyTorch",5],["c","%%backend torch\nimport keras\nfrom keras import layers\n\nclass CustomModel(keras.Model):\n    def train_step(self, data):\n        inputs, targets = data\n        predictions = self(inputs, training=True)\n        loss = self.compute_loss(y=targets, y_pred=predictions)\n\n        loss.backward()\n        trainable_weights = [v for v in self.trainable_weights]\n        gradients = [v.value.grad for v in trainable_weights]\n\n        with torch.no_grad():\n            self.optimizer.apply(gradients, trainable_weights)\n\n        for metric in self.metrics:\n            if metric.name == \"loss\":\n                metric.update_state(loss)\n            else:\n                metric.update_state(targets, predictions)\n\n        return {m.name: m.result() for m in self.metrics}"],["c","%%backend torch\ndef get_custom_model():\n    inputs = keras.Input(shape=(28 * 28,))\n    features = layers.Dense(512, activation=\"relu\")(inputs)\n    features = layers.Dropout(0.5)(features)\n    outputs = layers.Dense(10, activation=\"softmax\")(features)\n    model = CustomModel(inputs, outputs)\n    model.compile(\n        optimizer=keras.optimizers.Adam(),\n        loss=keras.losses.SparseCategoricalCrossentropy(),\n        metrics=[keras.metrics.SparseCategoricalAccuracy()],\n    )\n    return model\n\nmodel = get_custom_model()\nmodel.fit(train_images, train_labels, epochs=3)"],["h","train_step() metrics handling with JAX",5],["c","%%backend jax\nimport keras\nfrom keras import layers\n\nclass CustomModel(keras.Model):\n    def compute_loss_and_updates(\n        self,\n        trainable_variables,\n        non_trainable_variables,\n        inputs,\n        targets,\n        training=False,\n    ):\n        predictions, non_trainable_variables = self.stateless_call(\n            trainable_variables,\n            non_trainable_variables,\n            inputs,\n            training=training,\n        )\n        loss = self.compute_loss(y=targets, y_pred=predictions)\n        return loss, (predictions, non_trainable_variab th - height) * scale / 2 if width > height else 0\n    return [x, y, w, h]\n\nmetadata = {}\nfor annotation in annotations[\"annotations\"]:\n    id = annotation[\"image_id\"]\n    if id not in metadata:\n        metadata[id] = {\"boxes\": [], \"labels\": []}\n    image = images[id]\n    box = scale_box(annotation[\"bbox\"], image[\"width\"], image[\"height\"])\n    metadata[id][\"boxes\"].append(box)\n    metadata[id][\"labels\"].append(annotation[\"category_id\"])\n    metadata[id][\"path\"] = images_path + \"/train2017/\" + image[\"file_name\"]\nmetadata = list(metadata.values())"],["c","len(metadata)"],["c","min([len(x[\"boxes\"]) for x in metadata])"],["c","max([len(x[\"boxes\"]) for x in metadata])"],["c","max(max(x[\"labels\"]) for x in metadata) + 1"],["c","metadata[435]"],["c","[keras_hub.utils.coco_id_to_name(x) for x in metadata[435][\"labels\"]]"],["c","import matplotlib.pyplot as plt\nfrom matplotlib.colors import hsv_to_rgb\nfrom matplotlib.patches import Rectangle\n\ncolor_map = {0: \"gray\"}\n\ndef label_to_color(label):\n    if label not in color_map:\n        h, s, v = (len(color_map) * 0.618) % 1, 0.5, 0.9\n        color_map[label] = hsv_to_rgb((h, s, v))\n    return color_map[label]\n\ndef draw_box(ax, box, text, color):\n    x, y, w, h = box\n    ax.add_patch(Rectangle((x, y), w, h, lw=2, ec=color, fc=\"none\"))\n    textbox = dict(fc=color, pad=1, ec=\"none\")\n    ax.text(x, y, text, c=\"white\", size=10, va=\"bottom\", bbox=textbox)\n\ndef draw_image(ax, image):\n    ax.set(xlim=(0, 1), ylim=(1, 0), xticks=[], yticks=[], aspect=\"equal\")\n    image = plt.imread(image)\n    height, width = image.shape[:2]\n    hpad = (1 - height / width) / 2 if width > height else 0\n    wpad = (1 - width / height) / 2 if height > width else 0\n    extent = [wpad, 1 - wpad, 1 - hpad, hpad]\n    ax.imshow(image, extent=extent)"],["c","sample = metadata[435]\nig, ax = plt.subplots(dpi=300)\ndraw_image(ax, sample[\"path\"])\nfor box, label in zip(sample[\"boxes\ s.Dense(16, activation=\"relu\")(x)\nz_mean = layers.Dense(latent_dim, name=\"z_mean\")(x)\nz_log_var = layers.Dense(latent_dim, name=\"z_log_var\")(x)\nencoder = keras.Model(image_inputs, [z_mean, z_log_var], name=\"encoder\")"],["c","encoder.summary(line_length=80)"],["c","from keras import ops\n\nclass Sampler(keras.Layer):\n    def __init__(self, **kwargs):\n        super().__init__(**kwargs)\n        self.seed_generator = keras.random.SeedGenerator()\n        self.built = True\n\n    def call(self, z_mean, z_log_var):\n        batch_size = ops.shape(z_mean)[0]\n        z_size = ops.shape(z_mean)[1]\n        epsilon = keras.random.normal(\n            (batch_size, z_size), seed=self.seed_generator\n        )\n        return z_mean + ops.exp(0.5 * z_log_var) * epsilon"],["c","latent_inputs = keras.Input(shape=(latent_dim,))\nx = layers.Dense(7 * 7 * 64, activation=\"relu\")(latent_inputs)\nx = layers.Reshape((7, 7, 64))(x)\nx = layers.Conv2DTranspose(64, 3, activation=\"relu\", strides=2, padding=\"same\")(\n    x\n)\nx = layers.Conv2DTranspose(32, 3, activation=\"relu\", strides=2, padding=\"same\")(\n    x\n)\ndecoder_outputs = layers.Conv2D(1, 3, activation=\"sigmoid\", padding=\"same\")(x)\ndecoder = keras.Model(latent_inputs, decoder_outputs, name=\"decoder\")"],["c","decoder.summary(line_length=80)"],["c","class VAE(keras.Model):\n    def __init__(self, encoder, decoder, **kwargs):\n        super().__init__(**kwargs)\n        self.encoder = encoder\n        self.decoder = decoder\n        self.sampler = Sampler()\n        self.reconstruction_loss_tracker = keras.metrics.Mean(\n            name=\"reconstruction_loss\"\n        )\n        self.kl_loss_tracker = keras.metrics.Mean(name=\"kl_loss\")\n\n    def call(self, inputs):\n        return self.encoder(inputs)\n\n    def compute_loss(self, x, y, y_pred, sample_weight=None, training=True):\n        original = x\n        z_mean, z_log_var = y_pred\n        reconstruction = self.decoder(self.sampler(z_mean, z_log_var))\n\n        reconstruction_loss = ops.mean(\n            ops.sum(\n                keras.losses.binary_crossentropy(x, reconstruction), axis=(1, 2)\n            )\n        )\n        kl_loss = -0.5 * (\n            1 + z_log_var - ops.square(z_mean) - ops.exp(z_log_var)\n        )\n        total_loss = reconstruction_loss + ops.mean(kl_loss)\n\n        self.reconstruction_loss_tracker.update_state(reconstruction_loss)\n        self.kl_loss_tracker.update_state(kl_loss)\n        return total_loss"],["c","import numpy as np\n\n(x_train, _), (x_test, _) = keras.datasets.mnist.load_data()\nmnist_digits = np.concatenate([x_train, x_test], axis=0)\nmnist_digits = np.expand_dims(mnist_digits, -1).astype(\"float32\") / 255\n\nvae = VAE(encoder, decoder)\nvae.compile(optimizer=keras.optimizers.Adam())\nvae.fit(mnist_digits, epochs=30, batch_size=128)"],["c","import matplotlib.pyplot as plt\n\nn = 30\ndigit_size = 28\nfigure = np.zeros((digit_size * n, digit_size * n))\n\ngrid_x = np.linspace(-1, 1, n)\ngrid_y = np.linspace(-1, 1, n)[::-1]\n\nfor i, yi in enumerate(grid_y):\n    for j, xi in enumerate(grid_x):\n        z_sample = np.array([[xi, yi]])\n        x_decoded = vae.decoder.predict(z_sample)\n        digit = x_decoded[0].reshape(digit_size, digit_size)\n        figure[\n            i * digit_size : (i + 1) * digit_size,\n            j * digit_size : (j + 1) * digit_size,\n        ] = digit\n\nplt.figure(figsize=(15, 15))\nstart_range = digit_size // 2\nend_range = n * digit_size + start_range\npixel_range = np.arange(start_range, end_range, digit_size)\nsample_range_x = np.round(grid_x, 1)\nsample_range_y = np.round(grid_y, 1)\nplt.xticks(pixel_range, sample_range_x)\nplt.yticks(pixel_range, sample_range_y)\nplt.xlabel(\"z[0]\")\nplt.ylabel(\"z[1]\")\nplt.axis(\"off\")\nplt.imshow(figure, cmap=\"Greys_r\")"],["h","Diffusion models",3],["h","The Oxford Flowers dataset",4],["c","import os\n\nfpath = keras.utils.get_file(\n    origin=\"https://www.robots.ox.ac.uk/~vgg/data/flowers/102/102flowers.tgz\",\n    extract=True,\n)"],["c","batch_size = 32\nimage_size = 128\nimages_dir = os.path.join(fpath, \"jpg\")\ndataset = keras.utils.image_dataset_from_directory(\n    images_dir,\n    labels=None,\n    image_size=(image_size, image_size),\n    crop_to_aspect_ratio=True,\n)\ndataset = dataset.rebatch(\n    batch_size,\n    drop_remainder=True,\n)"],["c","from matplotlib import pyplot as plt\n\nfor batch in dataset:\n    img = batch.numpy()[0]\n    break\nplt.imshow(img.astype(\"uint8\"))"],["h","A U-Net denoising autoencoder",4],["c","def residual_block(x, width):\n    input_width = x.shape[3]\n    if input_width == width:\n        residual = x\n    else:\n        residual = layers.Conv2D(width, 1)(x)\n    x = layers.BatchNormalization(center=False, scale=False)(x)\n    x = layers.Conv2D(width, 3, padding=\"same\", activation=\"swish\")(x)\n    x = layers.Conv2D(width, 3, padding=\"same\")(x)\n    x = x + residual\n    return x\n\ndef get_model(image_size, widths, block_depth):\n    noisy_images = keras.Input(shape=(image_size, image_size, 3))\n    noise_rates = keras.Input(shape=(1, 1, 1))\n\n    x = layers.Conv2D(widths[0], 1)(noisy_images)\n    n = layers.UpSampling2D(image_size, interpolation=\"nearest\")(noise_rates)\n    x = layers.Concatenate()([x, n])\n\n    skips = []\n    for width in widths[:-1]:\n        for _ in range(block_depth):\n            x = residual_block(x, width)\n            skips.append(x)\n        x = layers.AveragePooling2D(pool_size=2)(x)\n\n    for _ in range(block_depth):\n        x = residual_block(x, widths[-1])\n\n    for width in reversed(widths[:-1]):\n        x = layers.UpSampling2D(size=2, interpolation=\"bilinear\")(x)\n        for _ in range(block_depth):\n            x = layers.Concatenate()([x, skips.pop()])\n            x = residual_block(x, width)\n\n    pred_noise_masks = layers.Conv2D(3, 1, kernel_initializer=\"zeros\")(x)\n\n    return keras.Model([noisy_images, noise_rates], pred_noise_masks)"],["h","The concepts of diffusion time and diffusion schedule",4],["c","def diffusion_schedule(\n    diffusion_times,\n    min_signal_rate=0.02,\n    max_signal_rate=0.95,\n):\n    start_angle = ops.cast(ops.arccos(max_signal_rate), \"float32\")\n    end_angle = ops.cast(ops.arccos(min_signal_rate), \"float32\")\n    diffusion_angles = start_angle + diffusion_times * (end_angle - start_angle)\n    signal_rates = ops.cos(diffusion_angles)\n    noise_rates = ops.sin(diffusion_angles)\n    return noise_rates, signal_rates"],["c","diffusion_times = ops.arange(0.0, 1.0, 0.01)\nnoise_rates, signal_rates = diffusion_schedule(diffusion_times)\n\ndiffusion_times = ops.convert_to_numpy(diffusion_times)\nnoise_rates = ops.convert_to_numpy(noise_rates)\nsignal_rates = ops.convert_to_numpy(signal_rates)\n\nplt.plot(diffusion_times, noise_rates, label=\"Noise rate\")\nplt.plot(diffusion_times, signal_rates, label=\"Signal rate\")\n\nplt.xlabel(\"Diffusion time\")\nplt.legend()"],["h","The training process",4],["c","class DiffusionModel(keras.Model):\n    def __init__(self, image_size, widths, block_depth, **kwargs):\n        super().__init__(**kwargs)\n        self.image_size = image_size\n        self.denoising_model = get_model(image_size, widths, block_depth)\n        self.seed_generator = keras.random.SeedGenerator()\n        self.loss = keras.losses.MeanAbsoluteError()\n        self.normalizer = keras.layers.Normalization()\n\n    def denoise(self, noisy_images, noise_rates, signal_rates):\n        pred_noise_masks = self.denoising_model([noisy_images, noise_rates])\n        pred_images = (\n            noisy_images - noise_rates * pred_noise_masks\n        ) / signal_rates\n        return pred_images, pred_noise_masks\n\n    def call(self, images):\n        images = self.normalizer(images)\n        noise_masks = keras.random.normal(\n            (batch_size, self.image_size, self.image_size, 3),\n            seed=self.seed_generator,\n        )\n        diffusion_times = keras.random.uniform(\n            (batch_size, 1, 1, 1),\n            minval=0.0,\n            maxval=1.0,\n            seed=self.seed_generator,\n        )\n        noise_rates, signal_rates = diffusion_schedule(diffusion_times)\n        noisy_images = signal_rates * images + noise_rates * noise_masks\n        pred_images, pred_noise_masks = self.denoise(\n            noisy_images, noise_rates, signal_rates\n        )\n        return pred_images, pred_noise_masks, noise_masks\n\n    def compute_loss(self, x, y, y_pred, sample_weight=None, training=True):\n        _, pred_noise_masks, noise_masks = y_pred\n        return self.loss(noise_masks, pred_noise_masks)\n\n    def generate(self, num_images, diffusion_steps):\n        noisy_images = keras.random.normal(\n            (num_images, self.image_size, self.image_size, 3),\n            seed=self.seed_generator,\n        )\n        step_size = 1.0 / diffusion_steps\n        for step in range(diffusion_steps):\n            diffusion_times = ops.ones((num_images, 1, 1, 1)) - step * step_size\n            noise_rates, signal_rates = diffusion_schedule(diffusion_times)\n            pred_images, pred_noises = self.denoise(\n                noisy_images, noise_rates, signal_rates\n            )\n            next_diffusion_times = diffusion_times - step_size\n            next_noise_rates, next_signal_rates = diffusion_schedule(\n                next_diffusion_times\n            )\n            noisy_images = (\n                next_signal_rates * pred_images + next_noise_rates * pred_noises\n            )\n        images = (\n            self.normalizer.mean + pred_images * self.normalizer.variance**0.5\n        )\n        return ops.clip(images, 0.0, 255.0)"],["h","The generation process",4],["h","Visualizing results with a custom callback",4],["c","class VisualizationCallback(keras.callbacks.Callback):\n    def __init__(self, diffusion_steps=20, num_rows=3, num_cols=6):\n        self.diffusion_steps = diffusi const REPO = DATA.repo;
const CH = DATA.chapters;

const $ = (s) => document.querySelector(s);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function esc(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

/* stats */
function blocksOf(ch) { return ch.items.filter((i) => i[0] === "c"); }
function linesOf(ch) { return blocksOf(ch).reduce((n, i) => n + i[1].split("\n").length, 0); }
const totalBlocks = CH.reduce((n, c) => n + blocksOf(c).length, 0);
const totalLines = CH.reduce((n, c) => n + linesOf(c), 0);
const fmt = (n) => n.toLocaleString("en-US");

/* theme and code size */
const root = document.documentElement;
function effectiveTheme() {
  const t = root.getAttribute("data-theme");
  if (t) return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function syncThemeLabel() { $("#themeBtn").textContent = effectiveTheme() === "dark" ? "Light" : "Dark"; }
const savedTheme = store("dlnb-theme");
if (savedTheme === "dark" || savedTheme === "light") root.setAttribute("data-theme", savedTheme);
syncThemeLabel();
$("#themeBtn").addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  store("dlnb-theme", next);
  syncThemeLabel();
});
let codeSize = parseInt(store("dlnb-size"), 10) || 13;
function applySize() { root.style.setProperty("--code-size", codeSize + "px"); }
applySize();
function bump(d) { codeSize = Math.max(11, Math.min(19, codeSize + d)); applySize(); store("dlnb-size", String(codeSize)); }
$("#fontDown").addEventListener("click", () => bump(-1));
$("#fontUp").addEventListener("click", () => bump(1));

/* copy */
function legacyCopy(text) {
  const t = document.createElement("textarea");
  t.value = text;
  t.setAttribute("readonly", "");
  t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  t.remove();
  return ok;
}
async function copyText(text, btn) {
  const label = btn.dataset.label || btn.textContent;
  btn.dataset.label = label;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = legacyCopy(text); }
  btn.textContent = ok ? "Copied" : "Press Ctrl+C";
  btn.classList.toggle("done", ok);
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1600);
}
function copyBtn(cls, label, getText) {
  const b = el("button", cls, label);
  b.type = "button";
  b.addEventListener("click", () => copyText(getText(), b));
  return b;
}

/* highlight */
function highlight(code) {
  try { if (window.hljs) return hljs.highlight(code, { language: "python", ignoreIllegals: true }).value; } catch (e) {}
  return esc(code);
}

/* sidebar */
const sideBody = $("#sideBody");
function chapterLabel(ch) { return ch.num; }
function renderChapterList(activeKey) {
  sideBody.innerHTML = "";
  sideBody.appendChild(el("div", "side-label", "Chapters"));
  const ul = el("ul", "chlist");
  CH.forEach((ch) => {
    const li = el("li");
    const a = el("a", "chlink");
    a.href = "#" + ch.key;
    a.appendChild(el("span", "n", chapterLabel(ch)));
    a.appendChild(el("span", "", ch.title));
    if (ch.key === activeKey) a.setAttribute("aria-current", "page");
    li.appendChild(a);
    ul.appendChild(li);
  });
  sideBody.appendChild(ul);
}

/* search */
function runSearch(q) {
  const needle = q.toLowerCase();
  const out = [];
  for (const ch of CH) {
    let heading = ch.title;
    ch.items.forEach((it, idx) => {
      if (it[0] === "h") { heading = it[1]; return; }
      if (it[0] !== "c") return;
      const low = it[1].toLowerCase();
      const at = low.indexOf(needle);
      if (at < 0) return;
      const start = it[1].lastIndexOf("\n", at) + 1;
      let end = it[1].indexOf("\n", at);
      if (end < 0) end = it[1].length;
      out.push({ ch, idx, heading, line: it[1].slice(start, end).trim(), at: at - start });
    });
  }
  return out;
}
function renderResults(q) {
  const res = runSearch(q);
  sideBody.innerHTML = "";
  sideBody.appendChild(el("div", "side-label", res.length ? Math.min(res.length, 60) + (res.length > 60 ? " of " + res.length : "") + " matches" : "No matches"));
  if (!res.length) { sideBody.appendChild(el("div", "empty", "Try a shorter word, like Dense or fit.")); return; }
  const ul = el("ul", "results");
  res.slice(0, 60).forEach((r) => {
    const li = el("li");
    const b = el("button", "res");
    b.type = "button";
    b.appendChild(el("span", "where", "Ch. " + r.ch.num + " · " + r.heading));
    const snip = el("span", "snip");
    const m = r.line.toLowerCase().indexOf(q.toLowerCase());
    if (m >= 0) {
      snip.appendChild(document.createTextNode(r.line.slice(0, m)));
      snip.appendChild(el("mark", "", r.line.slice(m, m + q.length)));
      snip.appendChild(document.createTextNode(r.line.slice(m + q.length)));
    } else snip.textContent = r.line;
    b.appendChild(snip);
    b.addEventListener("click", () => go(r.ch.key, r.idx));
    li.appendChild(b);
    ul.appendChild(li);
  });
  sideBody.appendChild(ul);
}
let currentKey = "home";
$("#search").addEventListener("input", (e) => {
  const q = e.target.value.trim();
  if (q.length < 2) renderChapterList(currentKey);
  else renderResults(q);
});

/* drawer */
const side = $("#side"), scrim = $("#scrim"), menuBtn = $("#menuBtn");
function setDrawer(open) {
  side.classList.toggle("open", open);
  scrim.hidden = !open;
  menuBtn.setAttribute("aria-expanded", String(open));
}
menuBtn.addEventListener("click", () => setDrawer(!side.classList.contains("open")));
scrim.addEventListener("click", () => setDrawer(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setDrawer(false); });
sideBody.addEventListener("click", (e) => { if (e.target.closest(".chlink")) setDrawer(false); });

/* views */
const main = $("#main");
function metaLine(ch) { return blocksOf(ch).length + " code blocks · " + fmt(linesOf(ch)) + " lines"; }

function renderHome() {
  main.innerHTML = "";
  main.appendChild(el("p", "eyebrow", "Companion notebooks"));
  main.appendChild(el("h1", "", "Deep Learning with Python, third edition"));
  main.appendChild(el("p", "lede", "Every code block from the notebooks, one chapter per page, with a Copy button on each block, each section and each chapter. The notebooks leave out the book's text, so read them next to your copy of the book."));
  main.appendChild(el("p", "meta", CH.length + " chapters · " + fmt(totalBlocks) + " code blocks · " + fmt(totalLines) + " lines"));
  const cards = el("div", "cards");
  CH.forEach((ch) => {
    const a = el("a", "card");
    a.href = "#" + ch.key;
    a.appendChild(el("span", "num", "CHAPTER " + ch.num));
    a.appendChild(el("span", "t", ch.title));
    a.appendChild(el("span", "m", metaLine(ch)));
    cards.appendChild(a);
  });
  main.appendChild(cards);
}

function renderChapter(ch, focusIdx) {
  main.innerHTML = "";
  main.appendChild(el("p", "eyebrow", "Chapter " + ch.num));
  main.appendChild(el("h1", "", ch.title));
  main.appendChild(el("p", "meta", metaLine(ch)));
  const actions = el("div", "actions");
  actions.appendChild(copyBtn("btn primary", "Copy all code", () => blocksOf(ch).map((i) => i[1]).join("\n\n")));
  const colab = el("a", "btn", "Open in Colab");
  colab.href = "https://colab.research.google.com/github/" + REPO + "/blob/main/" + ch.file;
  colab.target = "_blank";
  colab.rel = "noopener";
  actions.appendChild(colab);
  const gh = el("a", "btn", "View on GitHub");
  gh.href = "https://github.com/" + REPO + "/blob/main/" + ch.file;
  gh.target = "_blank";
  gh.rel = "noopener";
  actions.appendChild(gh);
  main.appendChild(actions);

  const items = ch.items;
  const groups = {};
  items.forEach((it, i) => {
    if (it[0] !== "h") return;
    const lvl = it[2];
    const codes = [];
    for (let j = i + 1; j < items.length; j++) {
      const n = items[j];
      if (n[0] === "h" && n[2] <= lvl) break;
      if (n[0] === "c") codes.push(n[1]);
    }
    groups[i] = codes;
  });

  const body = el("div", "body");
  let n = 0;
  const total = blocksOf(ch).length;
  items.forEach((it, i) => {
    if (it[0] === "h") {
      if (it[2] <= 1 || (i === 0 && it[2] === 2)) return;
      const row = el("div", "sec");
      row.appendChild(el(it[2] === 2 ? "h2" : it[2] === 3 ? "h3" : "h4", "", it[1]));
      if (groups[i] && groups[i].length) {
        const codes = groups[i];
        row.appendChild(copyBtn("btn", codes.length > 1 ? "Copy section" : "Copy", () => codes.join("\n\n")));
      }
      body.appendChild(row);
    } else if (it[0] === "n") {
      body.appendChild(el("p", "note", it[1]));
    } else {
      n += 1;
      const fig = el("figure", "cell");
      fig.id = "cell-" + i;
      const bar = el("div", "cell-bar");
      bar.appendChild(el("span", "", "Block " + n + " of " + total));
      bar.appendChild(copyBtn("copy", "Copy", () => it[1]));
      fig.appendChild(bar);
      const pre = el("pre");
      const code = el("code", "hljs language-python");
      code.innerHTML = highlight(it[1]);
      pre.appendChild(code);
      fig.appendChild(pre);
      body.appendChild(fig);
    }
  });
  main.appendChild(body);

  const k = CH.indexOf(ch);
  const pager = el("nav", "pager");
  pager.setAttribute("aria-label", "Chapter navigation");
  if (k > 0) {
    const a = el("a", "btn", "← Chapter " + CH[k - 1].num + ": " + CH[k - 1].title);
    a.href = "#" + CH[k - 1].key;
    pager.appendChild(a);
  }
  if (k < CH.length - 1) {
    const a = el("a", "btn next", "Chapter " + CH[k + 1].num + ": " + CH[k + 1].title + " →");
    a.href = "#" + CH[k + 1].key;
    pager.appendChild(a);
  }
  main.appendChild(pager);

  if (focusIdx != null) {
    const target = document.getElementById("cell-" + focusIdx);
    if (target) {
      target.scrollIntoView({ block: "start" });
      target.classList.add("hit");
      setTimeout(() => target.classList.remove("hit"), 2200);
      return;
    }
  }
  window.scrollTo(0, 0);
}

/* routing */
let pendingFocus = null;
function go(key, idx) {
  pendingFocus = idx;
  setDrawer(false);
  if (location.hash.slice(1) === key) route();
  else location.hash = key;
}
function route() {
  const key = location.hash.slice(1);
  const ch = CH.find((c) => c.key === key);
  currentKey = ch ? ch.key : "home";
  const q = $("#search").value.trim();
  if (q.length < 2) renderChapterList(currentKey);
  if (ch) renderChapter(ch, pendingFocus);
  else { renderHome(); window.scrollTo(0, 0); }
  pendingFocus = null;
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
